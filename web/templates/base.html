<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title</title>
  <meta name="description" content="$description">
  <link rel="canonical" href="$canonical">
  <meta property="og:title" content="$title">
  <meta property="og:description" content="$description">
  <meta property="og:url" content="$canonical">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="shell">
      <a class="site-name" href="/">$name</a>
      <nav aria-label="Primary"><ul>$navigation</ul></nav>
    </div>
  </header>
  <main id="main" tabindex="-1">$body</main>
  <footer class="site-footer">
    <div class="shell">
      <p class="footer-name">$name</p>
      <address>$street<br>$locality<br><a href="$phone_href">$phone</a></address>
      <p><a href="/visit-us/">Visit Us</a> · <a href="/contact/">Contact</a></p>
    </div>
  </footer>
</body>
</html>
